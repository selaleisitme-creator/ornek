<!DOCTYPE html>

<html lang="tr"><head><meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#b88716" name="theme-color"/>
<title>Selale İşitme · Dolu Demo</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;background:#f4f8f7;font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;color:#183b38}
.side{width:210px;flex:none;background:#493a17;color:#fff1bc;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;color:#fff;font-weight:700;line-height:1.15}
.mark{width:38px;height:38px;border-radius:11px;background:#b88716;display:grid;place-items:center;font:22px Georgia;flex:none}
.brand small{display:block;font-weight:500;color:#9fc4bc;font-size:11px}
.side .brand.side-identity{--flower-stroke:#f3d587;--flower-accent:#d6a62d;--word-color:#fff5d5;--caption-color:#e5d09b;padding:5px 2px 18px;margin-bottom:10px;justify-content:center;border-bottom:1px solid #f1d89135;}
.side-identity .selale-sign{display:block;width:100%;max-width:192px;height:auto;filter:drop-shadow(0 2px 3px #1a130438);}
.side a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:inherit;text-decoration:none;font-weight:600;margin-bottom:3px}
.side a svg{width:19px;height:19px;flex:none}
.side a:hover{background:#ffffff14}
.side a.on{background:#b88716;color:#fff}
.view{flex:1;min-width:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#f4f8f7}
iframe.on{display:block}
.logout{margin-top:auto;border:1px solid #ffffff36;border-radius:11px;background:transparent;color:inherit;text-align:left;padding:11px 12px;font:600 14px inherit;cursor:pointer}.logout:hover{background:#ffffff14}
.auth-locked .side{display:none!important}.auth-locked .view{width:100vw;height:100vh;flex:none;margin:0}.auth-locked #f-login{position:fixed;inset:0;width:100vw;height:100vh;z-index:100;background:#fff}.auth-locked #bkbar,.auth-locked #bk,.auth-locked #bkt{display:none!important}
@media (max-width:760px){
 body{flex-direction:column}
 .side{width:100%;flex-direction:row;padding:6px;overflow-x:auto;gap:4px;order:2}
 .brand{display:none}
 .side a{flex:1;flex-direction:column;gap:3px;padding:7px 8px;font-size:11px;margin:0;min-width:64px;text-align:center}
 .view{order:1}
}

#bkbar{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none}
.bkn{pointer-events:auto;margin:10px auto 0;width:max-content;max-width:calc(100% - 24px);background:#fff4d9;border:1px solid #f0d995;color:#6b4b00;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:0 8px 24px #0002}
.bkn button{border:1px solid #b88716;background:#b88716;color:#fff;border-radius:8px;padding:6px 12px;font:700 13px inherit;cursor:pointer}.bkn button.x{background:#fff;color:#6b4b00;border-color:#e3cd8a}
.bkb{position:fixed;inset:0;background:#0a1f1d99;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.bkm{background:#fff;border-radius:18px;padding:24px;width:min(520px,100%);max-height:94vh;overflow:auto;box-shadow:0 25px 80px #0b302a50}
.bkm h3{margin:0 0 6px;font-size:20px}.bkp{color:#708783;margin:0 0 14px}.bkh{color:#708783;font-size:12.5px;margin:6px 0 12px}
.bkr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e1ebe8}.bkr span{color:#708783}.bkr b{text-align:right}
.bkl{display:block;font-weight:700;margin-top:14px}.bkl select{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #dbe6e2;border-radius:10px;font:inherit;background:#fff}
.bka{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid #e1ebe8}
.bkb1,.bkb2{border-radius:10px;padding:10px 16px;font:700 14px inherit;cursor:pointer;border:1px solid #dbe6e2;background:#fff;color:#183b38}.bkb1{background:#b88716;border-color:#b88716;color:#fff}.bkb1:disabled{opacity:.6}
.bkb2{margin-top:10px}
#bkt{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#493a17;color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:calc(100% - 24px)}
#bkt.show{opacity:1;transform:translateX(-50%)}#bkt.bad{background:#b42318}

f}#appReminderPopup button.close-reminder{border:0;padding:0 4px;background:transparent;font-size:23px;color:#69798a}@media(max-width:520px){#appReminderPopup{right:14px;bottom:14px}}</style><style id="selale-shell-refresh">
